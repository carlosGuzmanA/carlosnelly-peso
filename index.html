<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a56db">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Peso">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Peso Familia Guzmán</title>
<style>
  /* === DESIGN TOKENS (shadcn/ui light) === */
  :root {
    --bg:          #ffffff;
    --bg-muted:    #f8fafc;
    --bg-subtle:   #f1f5f9;

    --border:      #e2e8f0;
    --border-focus:#3b82f6;

    --fg:          #0f172a;
    --fg-muted:    #64748b;
    --fg-subtle:   #94a3b8;

    --primary:     #2563eb;
    --primary-hov: #1d4ed8;
    --primary-fg:  #ffffff;
    --primary-muted: #eff6ff;
    --primary-border: #bfdbfe;

    --pink:        #db2777;
    --pink-muted:  #fdf2f8;
    --pink-border: #fbcfe8;

    --success:     #16a34a;
    --success-muted: #f0fdf4;
    --success-border: #bbf7d0;

    --danger:      #dc2626;
    --danger-hov:  #b91c1c;
    --danger-muted:#fef2f2;
    --danger-border:#fecaca;

    --warn:        #d97706;
    --warn-muted:  #fffbeb;
    --warn-border: #fde68a;

    --ring:        rgba(37,99,235,.25);
    --radius:      12px;
    --radius-sm:   8px;
    --radius-xs:   6px;
    --shadow-sm:   0 1px 2px rgba(0,0,0,.05);
    --shadow:      0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg-muted);
    color: var(--fg);
    font-size: 20px;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* === LAYOUT === */
  .app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  /* === HEADER === */
  .header {
    background: var(--bg);
    padding: 18px 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .header h1 {
    font-size: 22px; font-weight: 700; color: var(--fg); letter-spacing: -.4px;
  }
  .header h1 span { font-size: 12px; font-weight: 500; color: var(--fg-subtle); vertical-align: middle; margin-left: 6px; }

  /* === TABS === */
  .tabs { display: flex; gap: 0; margin-top: 2px; }
  .tab {
    flex: 1; padding: 12px 6px; font-size: 15px; font-weight: 500;
    text-align: center; cursor: pointer; border: none; background: none;
    color: var(--fg-muted); border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    -webkit-appearance: none; appearance: none;
    min-height: 48px;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  /* === MAIN CONTENT === */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .section { display: none; padding: 20px; gap: 0; }
  .section.active { display: block; }

  /* === PERSON SELECTOR === */
  .person-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .person-btn {
    padding: 16px 12px; border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    text-align: center; background: var(--bg);
    transition: border-color .15s, background .15s, box-shadow .15s;
    box-shadow: var(--shadow-sm);
  }
  .person-btn:hover { border-color: var(--fg-subtle); }
  .person-btn.carlos.active {
    border-color: var(--primary-border);
    background: var(--primary-muted);
    box-shadow: 0 0 0 3px var(--ring);
  }
  .person-btn.nelly.active {
    border-color: var(--pink-border);
    background: var(--pink-muted);
    box-shadow: 0 0 0 3px rgba(219,39,119,.15);
  }

  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; margin: 0 auto 10px;
  }
  .avatar.c { background: var(--primary-muted); color: var(--primary); border: 1px solid var(--primary-border); }
  .avatar.n { background: var(--pink-muted);    color: var(--pink);    border: 1px solid var(--pink-border); }

  .person-btn .pname { font-size: 20px; font-weight: 600; color: var(--fg); }
  .person-btn .page  { font-size: 14px; color: var(--fg-muted); margin-top: 2px; }

  /* === LAST RECORD CARD === */
  .last-card {
    background: var(--bg); border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 18px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    display: flex; justify-content: space-between; align-items: center;
  }
  .last-card .lc-label {
    font-size: 11px; color: var(--fg-subtle); font-weight: 500;
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px;
  }
  .last-card .lc-weight { font-size: 44px; font-weight: 700; color: var(--fg); line-height: 1; letter-spacing: -1px; }
  .last-card .lc-date   { font-size: 13px; color: var(--fg-muted); margin-top: 5px; }

  .badge {
    padding: 5px 12px; border-radius: var(--radius-xs);
    font-size: 14px; font-weight: 600; border: 1px solid transparent;
    min-width: 72px; text-align: center; display: inline-block;
  }
  .badge.down { background: var(--success-muted); color: var(--success); border-color: var(--success-border); }
  .badge.up   { background: var(--danger-muted);  color: var(--danger);  border-color: var(--danger-border); }
  .badge.same { background: var(--bg-subtle);      color: var(--fg-muted); border-color: var(--border); }

  /* === FORM === */
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block; font-size: 14px; font-weight: 500;
    color: var(--fg-muted); margin-bottom: 7px;
  }
  .form-group input {
    width: 100%; padding: 13px 14px; font-size: 20px; font-weight: 500;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--fg);
    -webkit-appearance: none; appearance: none;
    transition: border-color .15s, box-shadow .15s;
    min-height: 54px;
  }
  .form-group input:focus {
    outline: none; border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--ring);
  }
  .form-group input[type="date"] { font-size: 18px; }
  .form-group input::placeholder { color: var(--fg-subtle); font-weight: 400; }

  .btn-save {
    width: 100%; padding: 16px; background: var(--primary);
    color: var(--primary-fg); border: none; border-radius: var(--radius-sm);
    font-size: 18px; font-weight: 600; cursor: pointer;
    transition: background .15s, box-shadow .15s, transform .1s;
    -webkit-appearance: none; appearance: none;
    min-height: 54px; margin-top: 6px;
    box-shadow: 0 1px 2px rgba(37,99,235,.3);
  }
  .btn-save:hover  { background: var(--primary-hov); }
  .btn-save:active { background: var(--primary-hov); transform: scale(.99); }

  /* === SECTION LABEL === */
  .section-label {
    font-size: 11px; font-weight: 600; color: var(--fg-subtle);
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 10px; margin-top: 6px;
  }

  /* === STATS GRID === */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: var(--bg); border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px; box-shadow: var(--shadow-sm);
  }
  .stat-card .sc-label {
    font-size: 11px; color: var(--fg-subtle); font-weight: 500;
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px;
  }
  .stat-card .sc-val   { font-size: 26px; font-weight: 700; color: var(--fg); letter-spacing: -.5px; }
  .stat-card .sc-sub   { font-size: 13px; color: var(--fg-muted); margin-top: 3px; }

  /* === CHART === */
  .chart-card {
    background: var(--bg); border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px 16px 16px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--fg-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .05em; }
  .chart-wrap  { position: relative; width: 100%; height: 240px; }

  /* === HISTORY === */
  .history-card {
    background: var(--bg); border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .hist-item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    column-gap: 14px;
    padding: 15px 18px; border-bottom: 1px solid var(--bg-subtle);
    transition: background .1s;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-item:active { background: var(--bg-subtle); }
  .hist-date  { font-size: 20px; font-weight: 600; color: var(--fg); }
  .hist-sub   { font-size: 13px; color: var(--fg-muted); margin-top: 2px; }
  .hist-right { text-align: right; }
  .hist-peso  { font-size: 20px; font-weight: 700; color: var(--fg); }
  .hist-diff  { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .hist-edit {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border: 1px solid var(--border); border-radius: var(--radius-xs);
    background: var(--bg); color: var(--fg-muted);
    font-size: 16px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    transition: background .1s, border-color .1s;
  }
  .hist-edit:hover  { border-color: var(--fg-subtle); background: var(--bg-subtle); }
  .hist-edit:active { background: var(--bg-subtle); }

  /* === EDIT MODAL === */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.4);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 1000;
    backdrop-filter: blur(2px);
  }
  .modal-backdrop.show { display: flex; }
  .modal-card {
    width: min(460px, 100%);
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,.12);
    padding: 24px;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--fg); margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-modal {
    flex: 1; padding: 13px; border-radius: var(--radius-sm);
    font-size: 16px; font-weight: 600; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    transition: background .15s, border-color .15s;
  }
  .btn-cancel {
    border: 1px solid var(--border); background: var(--bg); color: var(--fg-muted);
  }
  .btn-cancel:hover { background: var(--bg-subtle); }
  .btn-confirm { border: none; background: var(--primary); color: white; }
  .btn-confirm:hover  { background: var(--primary-hov); }
  .btn-confirm:active { background: var(--primary-hov); }
  .diff-down { color: var(--success); }
  .diff-up   { color: var(--danger); }

  /* === TOAST === */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--fg); color: white;
    padding: 12px 22px; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 500;
    opacity: 0; transition: all .22s; pointer-events: none; z-index: 999;
    white-space: nowrap; box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* === EMPTY === */
  .empty { text-align: center; padding: 48px 20px; color: var(--fg-subtle); font-size: 16px; }
  .empty .icon { font-size: 44px; margin-bottom: 12px; }

  /* === INSTALL BANNER === */
  .install-banner {
    background: var(--primary-muted); border: 1px solid var(--primary-border);
    border-radius: var(--radius-sm); padding: 14px 16px;
    margin-bottom: 16px; display: none; align-items: center; gap: 12px;
  }
  .install-banner.show { display: flex; }
  .install-banner p { flex: 1; font-size: 15px; color: var(--primary); font-weight: 500; }
  .btn-install {
    padding: 10px 16px; background: var(--primary); color: white;
    border: none; border-radius: var(--radius-xs);
    font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
    min-height: 44px;
  }

  /* === MOTIVATIONAL === */
  .motivational-message {
    margin-bottom: 16px; font-size: 18px; font-weight: 600;
    text-align: center; border-radius: var(--radius-sm);
    padding: 14px 12px;
    background: var(--success-muted); color: var(--success);
    border: 1px solid var(--success-border);
    min-height: 48px; display: flex;
    align-items: center; justify-content: center;
  }
  .motivational-message.up   { background: var(--danger-muted);  color: var(--danger);  border-color: var(--danger-border); }
  .motivational-message.same { background: var(--warn-muted);    color: var(--warn);    border-color: var(--warn-border); }
  .motivational-message:empty { display: none; }

  /* === SYNC INDICATOR === */
  .sync-dot {
    position: fixed; bottom: 16px; right: 16px;
    width: 8px; height: 8px; border-radius: 50%;
    background: transparent; transition: background .3s; z-index: 900;
  }
  .sync-dot.synced  { background: var(--success); }
  .sync-dot.syncing { background: var(--warn); animation: pulse-dot 1.2s infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* === SYNC TOAST (barra superior) === */
  .sync-toast {
    position: fixed; top: 0; left: 0; right: 0;
    background: var(--primary); color: white;
    padding: 12px 18px;
    font-size: 15px; font-weight: 500;
    display: flex; align-items: center; gap: 10px;
    transform: translateY(-100%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 1100;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .sync-toast.show  { transform: translateY(0); }
  .sync-toast.error { background: var(--danger); }
  .sync-toast.ok    { background: var(--success); }
  .sync-spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: white;
    animation: spin .75s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* === PESTAÑA ERRORES === */
  .tab-badge {
    display: inline-block;
    background: var(--danger); color: white;
    border-radius: 100px; font-size: 11px; font-weight: 700;
    padding: 1px 6px; margin-left: 4px;
    vertical-align: middle; line-height: 1.6;
  }
  .error-list { display: flex; flex-direction: column; gap: 10px; }
  .error-card {
    background: var(--bg); border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    padding: 15px 16px;
    border-left: 3px solid var(--danger);
  }
  .error-card.warn { border-left-color: var(--warn); }
  .error-ts   { font-size: 12px; color: var(--fg-subtle); margin-bottom: 5px; }
  .error-ctx  { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .error-msg  { font-size: 14px; color: var(--danger); word-break: break-word; }
  .error-card.warn .error-msg { color: var(--warn); }
  .btn-clear-errors {
    width: 100%; padding: 13px; margin-top: 10px;
    background: var(--bg); color: var(--fg-muted);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: background .1s;
  }
  .btn-clear-errors:hover { background: var(--bg-subtle); }
  .no-errors {
    text-align: center; padding: 48px 20px;
    color: var(--fg-subtle); font-size: 16px;
  }
  .no-errors .icon { font-size: 44px; margin-bottom: 12px; }

  @media (max-width: 480px) {
    .header { padding: 14px 14px 0; }
    .section { padding: 14px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="sync-dot" id="sync-dot"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <h1>Peso Familia Guzmán <span id="app-version"></span></h1>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('registrar')">Registrar</button>
      <button class="tab" onclick="showTab('progreso')">Progreso</button>
      <button class="tab" onclick="showTab('historial')">Historial</button>
      <button class="tab" id="tab-btn-errores" onclick="showTab('errores')" style="display:none;">Errores</button>
    </div>
  </div>

  <div class="content">

    <!-- TAB: REGISTRAR -->
    <div id="tab-registrar" class="section active">

      <div id="install-banner" class="install-banner">
        <p>Instala la app para acceder sin internet</p>
        <button class="btn-install" onclick="installApp()">Instalar</button>
      </div>

      <div class="person-grid">
        <button class="person-btn carlos active" id="btn-carlos" onclick="selectPerson('carlos')">
          <div class="avatar c">C</div>
          <div class="pname">Carlos</div>
          <div class="page">62 anos</div>
        </button>
        <button class="person-btn nelly" id="btn-nelly" onclick="selectPerson('nelly')">
          <div class="avatar n">N</div>
          <div class="pname">Nelly</div>
          <div class="page">59 anos</div>
        </button>
      </div>

      <div id="last-info"></div>

      <div id="motivational-message" class="motivational-message" aria-live="polite"></div>

      <div class="section-label">Nuevo registro</div>
      <div class="form-group">
        <label for="inp-peso">Peso en kilogramos</label>
        <input type="number" id="inp-peso" placeholder="ej. 74.5"
               step="0.1" min="30" max="250" inputmode="decimal" autocomplete="off" autofocus>
      </div>
      <div class="form-group">
        <label for="inp-fecha">Fecha</label>
        <input type="date" id="inp-fecha">
      </div>
      <button class="btn-save" onclick="guardar()">Guardar registro</button>
    </div>

    <!-- TAB: PROGRESO -->
    <div id="tab-progreso" class="section">
      <div class="person-grid">
        <button class="person-btn carlos active" id="prog-carlos" onclick="selectProg('carlos')">
          <div class="avatar c">C</div>
          <div class="pname">Carlos</div>
        </button>
        <button class="person-btn nelly" id="prog-nelly" onclick="selectProg('nelly')">
          <div class="avatar n">N</div>
          <div class="pname">Nelly</div>
        </button>
      </div>
      <div id="prog-content"></div>
    </div>

    <!-- TAB: HISTORIAL -->
    <div id="tab-historial" class="section">
      <div class="person-grid">
        <button class="person-btn carlos active" id="hist-carlos" onclick="selectHist('carlos')">
          <div class="avatar c">C</div>
          <div class="pname">Carlos</div>
        </button>
        <button class="person-btn nelly" id="hist-nelly" onclick="selectHist('nelly')">
          <div class="avatar n">N</div>
          <div class="pname">Nelly</div>
        </button>
      </div>
      <div id="hist-content"></div>
    </div>

    <!-- TAB: ERRORES -->
    <div id="tab-errores" class="section">
      <div id="errores-content">
        <div class="no-errors"><div class="icon">✅</div>Sin errores registrados</div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /app -->

<!-- SYNC TOAST -->
<div class="sync-toast" id="sync-toast">
  <div class="sync-spinner" id="sync-spinner"></div>
  <span id="sync-toast-msg">Conectando con Firestore...</span>
</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
  <div class="modal-card">
    <div class="modal-title" id="edit-modal-title">Editar registro</div>
    <div class="form-group">
      <label for="edit-fecha">Fecha</label>
      <input type="date" id="edit-fecha">
    </div>
    <div class="form-group">
      <label for="edit-peso">Peso en kilogramos</label>
      <input type="number" id="edit-peso" step="0.1" min="30" max="250" inputmode="decimal">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-modal btn-cancel" id="btn-edit-cancel">Cancelar</button>
      <button type="button" class="btn-modal btn-danger" id="btn-edit-delete" style="background:var(--red);color:white;">Eliminar</button>
      <button type="button" class="btn-modal btn-confirm" id="btn-edit-save">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>

const FIREBASE_CONFIG = {

  authDomain: "carlosnelly-peso.firebaseapp.com",
  projectId: "carlosnelly-peso",
  storageBucket: "carlosnelly-peso.firebasestorage.app",
  messagingSenderId: "490399842347",
  appId: "1:490399842347:web:7c3b4fccffa737b860aa6e"
};

// ID único de esta familia — no lo compartas públicamente.
// Puedes cambiarlo por cualquier texto largo y único.
const FAMILIA_DOC_ID = "guzman-familia-peso-2024";

let fbStore = null;

// === LOG DE ERRORES ===
const errorLog = [];

function logError(contexto, error, tipo) {
  const entry = {
    ts: new Date().toLocaleString('es-MX'),
    contexto,
    msg: error && error.message ? error.message : String(error),
    code: error && error.code ? error.code : '',
    tipo: tipo || 'error'
  };
  errorLog.unshift(entry);
  renderErrors();
  updateErrorBadge();
}

function updateErrorBadge() {
  const btn = document.getElementById('tab-btn-errores');
  if (!btn) return;
  const old = btn.querySelector('.tab-badge');
  if (old) old.remove();
  if (errorLog.length > 0) {
    btn.style.display = '';
    const badge = document.createElement('span');
    badge.className = 'tab-badge';
    badge.textContent = errorLog.length;
    btn.appendChild(badge);
  } else {
    btn.style.display = 'none';
    if (document.getElementById('tab-errores').classList.contains('active')) {
      showTab('registrar');
    }
  }
}

function renderErrors() {
  const el = document.getElementById('errores-content');
  if (!el) return;
  if (!errorLog.length) {
    el.innerHTML = '<div class="no-errors"><div class="icon">✅</div>Sin errores registrados</div>';
    return;
  }
  const items = errorLog.map(e => `
    <div class="error-card ${e.tipo === 'warn' ? 'warn' : ''}">
      <div class="error-ts">${e.ts}</div>
      <div class="error-ctx">${e.contexto}</div>
      <div class="error-msg">${e.msg}${e.code ? ' (' + e.code + ')' : ''}</div>
    </div>`).join('');
  el.innerHTML = `<div class="error-list">${items}</div>
    <button class="btn-clear-errors" onclick="clearErrors()">Limpiar errores</button>`;
}

function clearErrors() {
  errorLog.length = 0;
  renderErrors();
  updateErrorBadge();
}

// === SYNC TOAST (paso a paso) ===
let syncToastTimer = null;

function showSyncToast(msg, tipo) {
  const toast = document.getElementById('sync-toast');
  const msgEl = document.getElementById('sync-toast-msg');
  const spinner = document.getElementById('sync-spinner');
  if (!toast || !msgEl) return;
  if (syncToastTimer) { clearTimeout(syncToastTimer); syncToastTimer = null; }
  msgEl.textContent = msg;
  toast.className = 'sync-toast show' + (tipo === 'error' ? ' error' : tipo === 'ok' ? ' ok' : '');
  spinner.style.display = (tipo === 'error' || tipo === 'ok') ? 'none' : 'block';
  if (tipo === 'ok' || tipo === 'error') {
    syncToastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3500);
  }
}

function hideSyncToast() {
  const toast = document.getElementById('sync-toast');
  if (toast) toast.classList.remove('show');
}

function isFirebaseConfigured() {
  return !FIREBASE_CONFIG.apiKey.startsWith('REEMPLAZA');
}

function setSyncDot(state) {
  const dot = document.getElementById('sync-dot');
  if (!dot) return;
  dot.className = 'sync-dot' + (state === 'synced' ? ' synced' : state === 'syncing' ? ' syncing' : '');
}

function mergePersonData(localArr, cloudArr) {
  const map = {};
  for (const item of cloudArr) map[item.f] = item;
  for (const item of localArr) map[item.f] = item;
  return Object.values(map).sort((a, b) => a.f.localeCompare(b.f));
}

function mergeData(localData, cloudData) {
  return {
    carlos: mergePersonData(localData.carlos, cloudData.carlos),
    nelly:  mergePersonData(localData.nelly,  cloudData.nelly)
  };
}

async function loadFromFirestore() {
  if (!fbStore) return null;
  try {
    showSyncToast('Conectando con Firestore...');
    setSyncDot('syncing');

    const snap = await fbStore.doc(`familias/${FAMILIA_DOC_ID}`).get();

    if (snap.exists) {
      showSyncToast('Leyendo datos de la nube...');
      const cloudData = normalizeData(snap.data());
      const merged = mergeData(db, cloudData);
      const totalCloud  = cloudData.carlos.length + cloudData.nelly.length;
      const totalMerged = merged.carlos.length    + merged.nelly.length;

      if (totalMerged > totalCloud) {
        showSyncToast('Subiendo datos nuevos a la nube...');
        await fbStore.doc(`familias/${FAMILIA_DOC_ID}`).set(merged);
        showSyncToast('¡Datos sincronizados con la nube! ✓', 'ok');
      } else {
        showSyncToast('Datos al día ✓', 'ok');
      }

      setSyncDot('synced');
      return merged;
    }

    // Documento no existe: subir datos locales
    showSyncToast('Guardando datos en la nube por primera vez...');
    await fbStore.doc(`familias/${FAMILIA_DOC_ID}`).set(normalizeData(db));
    showSyncToast('Datos guardados en la nube ✓', 'ok');
    setSyncDot('synced');
    return null;

  } catch(e) {
    const msg = e && e.message ? e.message : String(e);
    showSyncToast('Error de sincronización — ver pestaña Errores', 'error');
    logError('Lectura de Firestore al iniciar', e);
    setSyncDot('');
    return null;
  }
}

async function saveToFirestore(data) {
  if (!fbStore) return;
  setSyncDot('syncing');
  try {
    await fbStore.doc(`familias/${FAMILIA_DOC_ID}`).set(normalizeData(data));
    setSyncDot('synced');
  } catch(e) {
    logError('Guardado en Firestore', e);
    setSyncDot('');
  }
}

function initFirebase() {
  if (!isFirebaseConfigured()) return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    fbStore = firebase.firestore();
    loadFromFirestore().then(cloudData => {
      if (!cloudData) return;
      db = cloudData;
      saveLocalOnly();
      renderLastInfo();
      renderHist();
      const active = document.querySelector('.tab.active');
      if (active && active.textContent.trim() === 'Progreso') renderProg();
    });
  } catch(e) {
    showSyncToast('Error al iniciar Firebase — ver pestaña Errores', 'error');
    logError('Inicialización de Firebase', e);
  }
}

const APP_VERSION = 'v17';
const KEY = 'mipeso_v2';
const IDB_NAME = 'mipeso_db';
const IDB_STORE = 'app_state';
const IDB_KEY = 'data';
const DEFAULTS = {
  carlos: [
    {f:'2024-09-12',p:82.6},{f:'2024-10-02',p:74.9},{f:'2024-10-15',p:73.9},
    {f:'2024-10-27',p:74.6},{f:'2024-11-30',p:74.1},{f:'2024-12-15',p:75.2},
    {f:'2024-12-30',p:74.6},{f:'2025-01-15',p:73.3},{f:'2025-01-30',p:74.8}
  ],
  nelly: [
    {f:'2024-09-12',p:87.3},{f:'2024-10-02',p:81.6},{f:'2024-10-15',p:80.2},
    {f:'2024-10-27',p:80.4},{f:'2024-11-30',p:80.3},{f:'2024-12-15',p:80.1},
    {f:'2024-12-30',p:80.0},{f:'2025-01-15',p:80.3},{f:'2025-01-30',p:81.1}
  ]
};

function cloneDefaults() {
  return JSON.parse(JSON.stringify(DEFAULTS));
}

function normalizeData(data) {
  if (!data || typeof data !== 'object') return cloneDefaults();
  return {
    carlos: Array.isArray(data.carlos) ? data.carlos : [],
    nelly: Array.isArray(data.nelly) ? data.nelly : []
  };
}

function loadDataFromLocalStorage() {
  try {
    const s = localStorage.getItem(KEY);
    return s ? normalizeData(JSON.parse(s)) : null;
  } catch(e) { return null; }
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const dbi = req.result;
      if (!dbi.objectStoreNames.contains(IDB_STORE)) dbi.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function readDataFromIDB() {
  if (!('indexedDB' in window)) return null;
  const dbi = await openDB();
  return new Promise((resolve, reject) => {
    const tx = dbi.transaction(IDB_STORE, 'readonly');
    const store = tx.objectStore(IDB_STORE);
    const req = store.get(IDB_KEY);
    req.onsuccess = () => resolve(req.result ? normalizeData(req.result) : null);
    req.onerror = () => reject(req.error);
  });
}

async function writeDataToIDB(data) {
  if (!('indexedDB' in window)) return;
  const dbi = await openDB();
  return new Promise((resolve, reject) => {
    const tx = dbi.transaction(IDB_STORE, 'readwrite');
    const store = tx.objectStore(IDB_STORE);
    store.put(normalizeData(data), IDB_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function loadData() {
  const fallback = loadDataFromLocalStorage() || cloneDefaults();
  if (!('indexedDB' in window)) return fallback;
  try {
    const idbData = await readDataFromIDB();
    if (idbData) return idbData;
    const localData = loadDataFromLocalStorage();
    const seed = localData || cloneDefaults();
    await writeDataToIDB(seed);
    return seed;
  } catch(e) {
    return fallback;
  }
}

function saveLocalOnly() {
  if ('indexedDB' in window) {
    writeDataToIDB(db).catch(() => {
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}
    });
    return;
  }
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}
}

function saveData() {
  saveLocalOnly();
  saveToFirestore(db); // no-op si no hay sesión iniciada
}

let db = cloneDefaults();
let regPerson = 'carlos', progPerson = 'carlos', histPerson = 'carlos';
let chartInst = null;
let deferredPrompt = null;
let editCtx = null;

// PWA install

function fmt(dateStr) {
  const [y,m,d] = dateStr.split('-');
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function fmtShort(dateStr) {
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}`;
}

/* ---- TABS ---- */
function showTab(t) {
  ['registrar','progreso','historial','errores'].forEach(id => {
    document.getElementById('tab-'+id).classList.remove('active');
  });
  document.querySelectorAll('.tab').forEach(b => {
    const target = b.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    b.classList.toggle('active', target === t);
  });
  document.getElementById('tab-'+t).classList.add('active');
  if (t === 'progreso') renderProg();
  if (t === 'historial') renderHist();
  if (t === 'errores') renderErrors();
}

/* ---- PERSON SELECT ---- */
function selectPerson(p) {
  regPerson = p;
  document.getElementById('btn-carlos').className = 'person-btn carlos' + (p==='carlos'?' active':'');
  document.getElementById('btn-nelly').className  = 'person-btn nelly'  + (p==='nelly' ?' active':'');
  renderLastInfo();
}
function selectProg(p) {
  progPerson = p;
  document.getElementById('prog-carlos').className = 'person-btn carlos' + (p==='carlos'?' active':'');
  document.getElementById('prog-nelly').className  = 'person-btn nelly'  + (p==='nelly' ?' active':'');
  renderProg();
}
function selectHist(p) {
  histPerson = p;
  document.getElementById('hist-carlos').className = 'person-btn carlos' + (p==='carlos'?' active':'');
  document.getElementById('hist-nelly').className  = 'person-btn nelly'  + (p==='nelly' ?' active':'');
  renderHist();
}

/* ---- LAST INFO ---- */
function renderLastInfo() {
  const r = db[regPerson];
  const el = document.getElementById('last-info');
  if (!r.length) { el.innerHTML = ''; return; }
  const last = r[r.length-1];
  const prev = r.length > 1 ? r[r.length-2] : null;
  let badgeHTML = '';
  if (prev) {
    const d = (last.p - prev.p).toFixed(1);
    const cls = d < 0 ? 'down' : d > 0 ? 'up' : 'same';
    const sym = d < 0 ? '▼' : d > 0 ? '▲' : '—';
    badgeHTML = `<div class="badge ${cls}">${sym} ${Math.abs(d)} kg</div>`;
  }
  el.innerHTML = `
    <div class="last-card">
      <div>
        <div class="lc-label">Ultimo registro</div>
        <div class="lc-weight">${last.p.toFixed(1)} kg</div>
        <div class="lc-date">${fmt(last.f)}</div>
      </div>
      ${badgeHTML}
    </div>`;
}

/* ---- GUARDAR ---- */
function guardar() {
  const pv = document.getElementById('inp-peso').value;
  const fv = document.getElementById('inp-fecha').value;
  if (!pv || isNaN(pv) || pv <= 0) { showToast('Ingresa un peso valido'); return; }
  if (!fv) { showToast('Selecciona la fecha'); return; }
  const peso = parseFloat(parseFloat(pv).toFixed(1));
  const exists = db[regPerson].findIndex(x => x.f === fv);
  if (exists >= 0) db[regPerson][exists].p = peso;
  else db[regPerson].push({ f: fv, p: peso });
  db[regPerson].sort((a,b) => a.f.localeCompare(b.f));
  saveData();
  document.getElementById('inp-peso').value = '';
  renderLastInfo();
  showToast('Registro guardado');
  if (window.navigator && window.navigator.vibrate) {
    window.navigator.vibrate(80);
  }
  document.getElementById('inp-peso').focus();
}

/* ---- PROGRESO ---- */
function renderProg() {
  const r = db[progPerson];
  const el = document.getElementById('prog-content');
  if (!r.length) {
    el.innerHTML = '<div class="empty"><div class="icon">&#128200;</div><p>Sin registros todavia</p></div>';
    if (chartInst) { chartInst.destroy(); chartInst = null; }
    return;
  }
  const first = r[0], last = r[r.length-1];
  const total = (last.p - first.p).toFixed(1);
  const min = Math.min(...r.map(x => x.p)).toFixed(1);
  const cls = total < 0 ? 'down' : total > 0 ? 'up' : 'same';
  const sym = total < 0 ? '▼' : total > 0 ? '▲' : '—';

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="sc-label">Peso actual</div>
        <div class="sc-val">${last.p.toFixed(1)} kg</div>
        <div class="sc-sub">${fmt(last.f)}</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Cambio total</div>
        <div class="sc-val ${cls === 'down' ? 'diff-down' : cls === 'up' ? 'diff-up' : ''}">${sym} ${Math.abs(total)} kg</div>
        <div class="sc-sub">desde el inicio</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Minimo</div>
        <div class="sc-val">${min} kg</div>
        <div class="sc-sub">mejor marca</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Registros</div>
        <div class="sc-val">${r.length}</div>
        <div class="sc-sub">pesajes</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">Evolucion del peso</div>
      <div class="chart-wrap">
        <canvas id="progChart" role="img" aria-label="Grafico de evolucion de peso de ${progPerson}">Datos de peso.</canvas>
      </div>
    </div>`;

  setTimeout(() => renderChart(r), 50);
}

function renderChart(r) {
  if (chartInst) { chartInst.destroy(); chartInst = null; }
  const canvas = document.getElementById('progChart');
  if (!canvas) return;

  const color = progPerson === 'carlos' ? '#1a56db' : '#be185d';
  const fill  = progPerson === 'carlos' ? 'rgba(26,86,219,.1)' : 'rgba(190,24,93,.1)';

  chartInst = new Chart(canvas, {
    type: 'line',
    data: {
      labels: r.map(x => fmtShort(x.f)),
      datasets: [{
        label: 'Peso (kg)',
        data: r.map(x => x.p),
        borderColor: color,
        backgroundColor: fill,
        borderWidth: 2.5,
        pointRadius: 5,
        pointBackgroundColor: color,
        pointBorderColor: 'white',
        pointBorderWidth: 2,
        fill: true,
        tension: 0.35
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => `${c.parsed.y.toFixed(1)} kg` } }
      },
      scales: {
        x: {
          ticks: { font: { size: 12 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 7, color: '#9ca3af' },
          grid: { color: 'rgba(0,0,0,.05)' }
        },
        y: {
          ticks: { font: { size: 12 }, color: '#9ca3af', callback: v => v.toFixed(0) + ' kg' },
          grid: { color: 'rgba(0,0,0,.05)' }
        }
      }
    }
  });
}

/* ---- HISTORIAL ---- */
function openEditModal(idx) {
  const person = histPerson;
  const all = db[person];
  const current = all[idx];
  if (!current) return;

  editCtx = { person, idx };
  document.getElementById('edit-fecha').value = current.f;
  document.getElementById('edit-peso').value = current.p.toFixed(1);
  document.getElementById('edit-modal').classList.add('show');
}

function closeEditModal() {
  editCtx = null;
  document.getElementById('edit-modal').classList.remove('show');
}

function saveEditModal() {
  if (!editCtx) return;
  const { person, idx } = editCtx;
  const all = db[person];
  if (!all[idx]) { closeEditModal(); return; }

  const newDate = document.getElementById('edit-fecha').value;
  const newPesoRaw = document.getElementById('edit-peso').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
    showToast('Fecha invalida (usa AAAA-MM-DD)');
    return;
  }
  const newPeso = parseFloat(parseFloat(newPesoRaw).toFixed(1));
  if (!newPeso || isNaN(newPeso) || newPeso <= 0) {
    showToast('Peso invalido');
    return;
  }

  const dupIdx = all.findIndex((x, i) => i !== idx && x.f === newDate);
  if (dupIdx >= 0) {
    const ok = confirm('Ya existe un registro en esa fecha. ¿Quieres reemplazarlo?');
    if (!ok) return;
    all[dupIdx].p = newPeso;
    all.splice(idx, 1);
  } else {
    all[idx] = { f: newDate, p: newPeso };
  }

  all.sort((a,b) => a.f.localeCompare(b.f));
  saveData();
  renderLastInfo();
  if (progPerson === person) renderProg();
  renderHist();
  closeEditModal();
  showToast('Registro actualizado');
}

function deleteEditModal() {
  if (!editCtx) return;
  const { person, idx } = editCtx;
  const all = db[person];
  if (!all[idx]) { closeEditModal(); return; }
  if (!confirm('¿Eliminar este registro de peso? Esta acción no se puede deshacer.')) return;
  all.splice(idx, 1);
  saveData();
  renderLastInfo();
  if (progPerson === person) renderProg();
  renderHist();
  closeEditModal();
  showToast('Registro eliminado');
}

function renderHist() {
  const r = [...db[histPerson]].reverse();
  const all = db[histPerson];
  const el = document.getElementById('hist-content');
  if (!r.length) {
    el.innerHTML = '<div class="empty"><div class="icon">&#128196;</div><p>Sin registros todavia</p></div>';
    return;
  }
  const items = r.map((item, i) => {
    const origIdx = all.length - 1 - i;
    const prev = origIdx > 0 ? all[origIdx-1] : null;
    let diffHTML = '';
    if (prev) {
      const d = (item.p - prev.p).toFixed(1);
      const cls = d < 0 ? 'diff-down' : d > 0 ? 'diff-up' : '';
      const sym = d < 0 ? '▼' : d > 0 ? '▲' : '—';
      diffHTML = `<div class="hist-diff ${cls}">${sym} ${Math.abs(d)} kg</div>`;
    }
    return `<div class="hist-item">
      <div>
        <div class="hist-date">${fmt(item.f)}</div>
      </div>
      <div class="hist-right">
        <div class="hist-peso">${item.p.toFixed(1)} kg</div>
        ${diffHTML}
      </div>
      <button type="button" class="hist-edit" data-idx="${origIdx}" aria-label="Editar registro">&#9998;</button>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="history-card">${items}</div>`;
}

/* ---- TOAST ---- */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

const today = new Date().toISOString().split('T')[0];
document.getElementById('inp-fecha').value = today;
document.getElementById('inp-peso').focus();
document.getElementById('hist-content').addEventListener('click', (e) => {

document.getElementById('btn-edit-save').addEventListener('click', saveEditModal);
document.getElementById('btn-edit-delete').addEventListener('click', deleteEditModal);
document.getElementById('edit-modal').addEventListener('click', (e) => {
  if (e.target.id === 'edit-modal') closeEditModal();
});

async function initData() {
  document.getElementById('app-version').textContent = APP_VERSION;
  db = await loadData();
  renderLastInfo();
  renderHist();
  const active = document.querySelector('.tab.active');
  if (active && active.textContent.trim() === 'Progreso') renderProg();
  initFirebase(); // inicia Firebase después de tener los datos locales listos
}

initData();
